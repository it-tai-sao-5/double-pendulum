<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Double Pendulum</h1>

    <canvas id="canvas"></canvas>

    <div class="controls">

        <div class="pendulum-control">
            <h2>Con lắc 1</h2>

            <label>
                Góc 1:
                <input id="angle1a" type="number" value="120" step="any">°
            </label>

            <label>
                Góc 2:
                <input id="angle2a" type="number" value="60" step="any">°
            </label>
        </div>

        <div class="pendulum-control">
            <h2>Con lắc 2</h2>

            <label>
                Góc 1:
                <input id="angle1b" type="number" value="120.000001" step="any">°
            </label>

            <label>
                Góc 2:
                <input id="angle2b" type="number" value="60" step="any">°
            </label>
        </div>

    </div>

    <button id="reset">Reset</button>

    <script src="script.js"></script>

</body>
</html>
